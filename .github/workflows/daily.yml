name: daily
on:
  schedule:
    # Four times a day. GitHub's scheduler runs late and sometimes skips a run; a later run on
    # the same UTC day replaces that day's files, so extra runs only add safety.
    - cron: "5 0,6,12,18 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.run
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Daily run $(date -u +%F)"
          git pull --rebase origin main
          git push
